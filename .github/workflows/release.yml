# Builds the surveyor binary for the supported targets and attaches the archives and
# a checksum file to a GitHub release when a v* tag is pushed. The gate runs first.
#
# A manual run (workflow_dispatch) builds the same archives from the chosen ref and
# keeps them as workflow artifacts without creating a release, which is how the
# pipeline is rehearsed before a tag is cut.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the workspace version and compare it with the tag
        id: read
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "workspace version: ${version}"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.target }}
    needs: [gate, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    env:
      ARCHIVE: surveyor-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --package surveyor --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          staging="$(mktemp -d)/${ARCHIVE}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/surveyor" LICENSE README.md "${staging}/"
          mkdir -p dist
          tar -C "$(dirname "${staging}")" -czf "dist/${ARCHIVE}.tar.gz" "${ARCHIVE}"
          cd dist
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          cat "${ARCHIVE}.tar.gz.sha256"

      - name: Smoke test the packaged binary
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          tar -C "${scratch}" -xzf "dist/${ARCHIVE}.tar.gz"
          "${scratch}/${ARCHIVE}/surveyor" --version | tee /dev/stderr | grep -qx "surveyor ${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, version]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble the checksum file
        run: |
          set -euo pipefail
          cd dist
          cat *.tar.gz.sha256 | sort -k2 > SHA256SUMS
          rm ./*.tar.gz.sha256
          shasum -a 256 -c SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          name: surveyor ${{ needs.version.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
