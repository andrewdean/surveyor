# The gate: formatting, clippy, tests, cargo-deny and cargo-machete, judged by exit code.
# Runs on pull requests and on main, and is reused by release.yml before anything is built.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      # The lance crates compile their protobuf schemas in build scripts.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-toolchain.toml names the toolchain and its components.
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo deny
        run: cargo deny check

      - name: cargo machete
        run: cargo machete
