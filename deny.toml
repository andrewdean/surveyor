[graph]
all-features = true

[advisories]
version = 2
yanked  = "deny"
ignore = [
    # paste: proc-macro used at build time by lance-bitpacking (via lancedb); no runtime surface.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro pulled in by lance" },
    # smartstring: rhai's small-string type; rhai parses repository scripts only, no untrusted network input.
    { id = "RUSTSEC-2026-0249", reason = "unmaintained; dependency of rhai, revisit when rhai moves off it" },
    # unsafe-libyaml: serde_yaml_ng via lindera via lance-tokenizer; Surveyor never feeds it YAML.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained; unreachable through Surveyor's use of lance" },
    # zstd 0.13 / zstd-safe 7.3: pinned by arrow-ipc 58, which lancedb 0.41 requires. Surveyor only
    # decompresses Lance files it wrote itself; lift when lancedb moves to arrow 59+.
    { id = "RUSTSEC-2026-0391", reason = "zstd pinned by arrow-ipc 58 via lancedb; no untrusted zstd input" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe pinned by arrow-ipc 58 via lancedb; no untrusted zstd input" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe pinned by arrow-ipc 58 via lancedb; no untrusted zstd input" },
]

[licenses]
version = 2
# Workspace crates are unpublished for now; Surveyor itself is Apache-2.0 (decided
# 2026-11-04, RFD section 17 item 3).
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "rustls everywhere" },
    { crate = "native-tls",  reason = "rustls everywhere" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
