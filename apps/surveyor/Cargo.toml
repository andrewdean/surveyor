[package]
name = "surveyor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "Surveyor command line: index a repository and ask it questions"

# `cargo binstall surveyor --git https://github.com/andrewdean/surveyor` fetches the
# archive release.yml attaches to the v<version> release for the host's target.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"

[[bin]]
name = "surveyor"
path = "src/main.rs"

[dependencies]
surveyor-model.workspace = true
surveyor-extract.workspace = true
surveyor-link.workspace = true
surveyor-store.workspace = true
surveyor-graph.workspace = true
surveyor-mcp.workspace = true
surveyor-rules.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
mimalloc.workspace = true

[dev-dependencies]
tempfile.workspace = true
scip.workspace = true
protobuf.workspace = true

[lints]
workspace = true
