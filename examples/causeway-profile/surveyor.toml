# Surveyor profile for the Causeway checkout. Causeway now carries this profile at
# its root (andrewdean/causeway#1077); this copy stays for the exit tests, which run
# it with `--profile examples/causeway-profile/surveyor.toml`, and for readers. Once
# that pull request merges, the committed `surveyor.toml` in Causeway is the source
# of truth and this file follows it.

[repository]
id = "causeway"

[walk]
# Hidden directories to walk: the mise task and library scripts (159 Rhai files)
# are the automation that the exit test's Rhai questions ask about. Every other
# dot-directory (`.claude/` with its stale worktrees, `.idea/`, `.jj/`) stays out.
include = [".mise"]

[sql]
dialect = "postgresql"
default_schema = "public"

[docs]
designs = ["docs/rfd/**/*.md", "docs/adrs/**/*.md", "docs/design/**/*.md"]
runbooks = ["docs/runbooks/**/*.md"]

[rules]
dirs = ["surveyor-rules"]
