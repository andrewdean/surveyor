# Context-pack eval over Causeway: ten tasks drawn from merged pull requests, each
# written as an agent would receive it, with the files and symbols the merged change
# touched as the answer key. `PLAN-surveyor-phase-2.md` (beside the RFD) records how
# the ten were chosen.
#
# Each task is scored against a store of the tree at `base`, the merge commit's
# parent, because a pack is what an agent is handed before it writes the change.
# `docs/eval/causeway-task-stores.sh <scratch>` builds those stores; then:
#
#   surveyor --repo-root ~/dev/trusted/causeway eval docs/eval/causeway-tasks.toml --stores <scratch>/stores
#
# `expect` lists node identifiers that existed at `base` and whose bodies the change
# edits; `files` lists files the change touched. A symbol the change added cannot be
# in the key, since no pack over the base tree can name it. The eval reports any
# identifier the base store does not hold.

