# Retrieval eval over Causeway (commit 40f993d7): plain-English questions and the nodes
# an engineer should open first. Run against the Causeway store:
#
#   surveyor --repo-root ~/dev/trusted/causeway --store "$SURVEYOR_STORE" eval docs/eval/causeway-questions.toml
#
# `expect` lists right starting points, not every relevant node. Several questions use
# words the repository does not (the `note` says which), because that is how the
# questions arrived in use. Task identifiers (`task:mise/...`) name the mise tasks the
# `.mise/toml/*.toml` files declare; the eval reports them as unknown on a store written
# before tasks were indexed.

[[question]]
ask = "where is development data created and how is it loaded"
expect = [
  "rust:jobs/causeway-seed/src/main.rs::SeedProfile",
  "rhai:.mise/rhai/causeway/loaders.rhai::run_loader",
  "task:mise/devdata:load",
  "task:mise/dev:data:bootstrap",
  "rust:crates/causeway-testkit/src/isolation.rs::in_workspace",
]
note = "asked on 2026-11-05; the user also says 'test data' where the repository says development data, seed and fixtures"

